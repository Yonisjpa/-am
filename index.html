<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Maxi 🌻</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Quicksand:wght@400;500;600&display=swap');

    :root {
      --cream: #fffaf2;
      --brown: #694333;
      --gold: #e7b35a;
      --line: #e8d8c4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        radial-gradient(circle at 12% 18%, rgba(236, 193, 112, .18) 0 2px, transparent 3px),
        radial-gradient(circle at 87% 72%, rgba(236, 193, 112, .22) 0 2px, transparent 3px),
        linear-gradient(135deg, #fffdf9, #fff6e8);
      color: var(--brown);
    }

    .card {
      position: relative;
      width: min(100%, 480px);
      overflow: hidden;
      padding: 22px 12px 18px;
      border: 1px solid #eadcca;
      border-radius: 30px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 14px 38px rgba(117, 77, 38, .09);
      text-align: center;
    }

    .heading {
      margin: 0;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: clamp(26px, 6vw, 34px);
      font-weight: 400;
      letter-spacing: .2px;
    }

    .subheading {
      margin: 4px 0 3px;
      font-family: "Quicksand", sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #b28a61;
      text-transform: uppercase;
    }

    .bouquet {
      display: block;
      width: 100%;
      max-width: 455px;
      margin: 8px auto 0;
    }

    /* Animación sutil y natural */
    .bouquet-art {
      transform-origin: 50% 88%;
      animation: gentle-sway 6s ease-in-out infinite;
    }

    /* Do not apply CSS transforms to flower groups:
       their SVG transform attributes position each flower. */

    .leaf {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: leaf-sway 5.5s ease-in-out infinite;
    }

    .leaf:nth-child(2n) { animation-delay: .6s; }

    /* Petals keep their SVG rotations and positions. */

    @keyframes gentle-sway {
      0%, 100% { transform: rotate(-.6deg) translateY(0); }
      50% { transform: rotate(.6deg) translateY(-3px); }
    }

    @keyframes leaf-sway {
      0%, 100% { transform: rotate(0); }
      50% { transform: rotate(2.5deg); }
    }

    .message {
      margin: -9px 0 0;
      font-family: "DM Serif Display", Georgia, serif;
      font-style: italic;
      font-size: clamp(43px, 10vw, 62px);
      line-height: 1.1;
      letter-spacing: -.8px;
      color: #704734;
    }

    .decoration {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      color: #c69a62;
      font-size: 17px;
    }

    .decoration::before,
    .decoration::after {
      content: "";
      width: 66px;
      height: 1px;
      background: #e4cdb0;
    }

    .heart {
      animation: heartbeat 2.2s ease-in-out infinite;
    }

    .footer {
      margin: 13px auto 0;
      font-family: "Quicksand", sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #a37d5b;
    }

    .spark {
      position: absolute;
      color: #dcb477;
      font-size: 18px;
      animation: sparkle 4s ease-in-out infinite;
      pointer-events: none;
    }

    .spark.one { top: 23%; left: 9%; }
    .spark.two { top: 33%; right: 9%; animation-delay: 1.3s; }
    .spark.three { bottom: 22%; left: 13%; animation-delay: 2s; }
    .spark.four { bottom: 29%; right: 12%; animation-delay: .7s; }

    @keyframes sparkle {
      0%, 100% { opacity: .35; transform: translateY(0) scale(.9); }
      50% { opacity: 1; transform: translateY(-7px) scale(1.1); }
    }

    @keyframes heartbeat {
      0%, 35%, 100% { transform: scale(1); }
      18% { transform: scale(1.2); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  
    body {
      position: relative;
      overflow-x: hidden;
    }

    .welcome,
    .letter {
      width: min(100%, 480px);
      text-align: center;
      border: 1px solid #eadcca;
      border-radius: 30px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 20px 60px rgba(117, 77, 38, .13);
      padding: 38px 26px 34px;
    }

    .welcome {
      animation: entrance .8s ease both;
    }

    .small-sunflower {
      width: 82px;
      height: 94px;
      margin: 0 auto 8px;
    }

    .small-sunflower svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .welcome-kicker {
      margin: 0 0 14px;
      color: #b28a61;
      font-family: "Quicksand", sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
    }

    .welcome h1 {
      margin: 0;
      color: #694333;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: clamp(36px, 9vw, 48px);
      font-weight: 400;
      letter-spacing: -.7px;
    }

    .welcome-text {
      margin: 13px 0 28px;
      color: #98765c;
      font-family: "Quicksand", sans-serif;
      font-size: 15px;
      line-height: 1.7;
    }

    .open-button,
    .close-letter {
      border: 1px solid #c9a17c;
      border-radius: 999px;
      padding: 13px 22px;
      color: #704734;
      background: #fffaf2;
      font-family: "Quicksand", sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(128, 83, 62, .08);
      transition: transform .2s ease, background .2s ease;
    }

    .open-button span {
      margin-left: 6px;
      font-size: 14px;
    }

    .open-button:hover,
    .close-letter:hover {
      background: #f7ead7;
      transform: translateY(-2px);
    }

    .card {
      display: none;
      opacity: 0;
      transform: translateY(16px) scale(.98);
    }

    .card.show {
      display: block;
      animation: reveal-card .95s ease forwards;
    }

    .letter {
      display: none;
      margin-top: 16px;
      animation: reveal-card .7s ease both;
    }

    .letter.show {
      display: block;
    }

    .letter-top {
      margin-bottom: 20px;
      color: #b28a61;
      font-family: "Quicksand", sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
    }

    .letter p {
      margin: 0 auto 15px;
      max-width: 350px;
      color: #704734;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 20px;
      line-height: 1.55;
    }

    .close-letter {
      margin-top: 8px;
      font-size: 12px;
    }

    .floating-heart {
      position: fixed;
      z-index: 5;
      bottom: -30px;
      color: #d9ad78;
      pointer-events: none;
      animation: float-heart 5s linear forwards;
    }

    @keyframes entrance {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes reveal-card {
      from { opacity: 0; transform: translateY(16px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float-heart {
      0% { opacity: 0; transform: translateY(0) scale(.8) rotate(0); }
      15% { opacity: .8; }
      100% { opacity: 0; transform: translateY(-90vh) scale(1.2) rotate(22deg); }
    }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .welcome, .letter { padding: 30px 20px; border-radius: 26px; }
    }

  </style>
</head>

<body>

  <section class="welcome" id="welcome" aria-label="Mensaje de bienvenida">
    <div class="small-sunflower" aria-hidden="true">
      <svg viewBox="0 0 100 116" role="img" aria-label="Girasol pequeño">
        <path d="M50 57 C49 75 49 92 50 108"

        <g transform="translate(50 34)">
          <g fill="#F0BE46" stroke="#D79A2F" stroke-width="1.2">

    </div>

    <h1>Oliiiii</h1>

    <p class="welcome-text">
      Preparé algo para ti.
    </p>

    <button class="open-button" id="openButton" type="button">
      Toca aquí <span>🌻</span>
    </button>
  </section>

  <main class="card" id="mainCard" aria-hidden="true">
    <span class="spark one">✦</span>

    <svg class="bouquet" viewBox="0 0 500 600"

          <path d="M250 205 C247 275 250 365 250 492"

          <!-- Tallo del girasol izquierdo -->

          <!-- Hojas inferiores, conectadas directamente a los tallos -->

          <path d="M268 445 Q355 430 390 380 Q320 365 265 408 L256 451 Z"/>
        </g>

        <!-- Pequeñas uniones para que cada hoja nazca del tallo -->

          <path d="M245 360 L218 332"/>

          <path d="M259 448 L298 425"/>
        </g>

        <!-- Nervaduras -->
        <g fill="none" stroke="#91ad80" stroke-width="2" opacity=".85">
          <path d="M210 377 L125 310"/>
          <path d="M290 374 L380 296"/>
          <path d="M220 416 L130 391"/>
          <path d="M280 416 L375 390"/>
          <path d="M245 340 L205 245"/>
          <path d="M260 340 L303 245"/>
        </g>

        <!-- Flores pequeñas -->
        <g fill="#fffefa" stroke="#d9d0c4" stroke-width="1.4">
          <g transform="translate(112 275)">
            <circle cx="0" cy="-8" r="7"/><circle cx="8" cy="0" r="7"/>
            <circle cx="0" cy="8" r="7"/><circle cx="-8" cy="0" r="7"/>
            <circle r="4" fill="#e9c35b" stroke="none"/>
          </g>
          <g transform="translate(388 275)">
            <circle cx="0" cy="-8" r="7"/><circle cx="8" cy="0" r="7"/>

            <circle r="4" fill="#e9c35b" stroke="none"/>
          </g>
          <g transform="translate(120 355) scale(.75)">
            <circle cx="0" cy="-8" r="7"/><circle cx="8" cy="0" r="7"/>
            <circle cx="0" cy="8" r="7"/><circle cx="-8" cy="0" r="7"/>
            <circle r="4" fill="#e9c35b" stroke="none"/>
          </g>
          <g transform="translate(380 355) scale(.75)">
            <circle cx="0" cy="-8" r="7"/><circle cx="8" cy="0" r="7"/>
            <circle cx="0" cy="8" r="7"/><circle cx="-8" cy="0" r="7"/>
            <circle r="4" fill="#e9c35b" stroke="none"/>
          </g>
        </g>

        <!-- Girasol izquierdo -->
        <g class="flower" transform="translate(158 250)">
          <g class="petal" fill="#f5b52f" stroke="#d78b19" stroke-width="2">
            <ellipse rx="16" ry="51" transform="rotate(0) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(30) translate(0 -40)"/>

            <ellipse rx="16" ry="51" transform="rotate(150) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(180) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(210) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(240) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(270) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(300) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(330) translate(0 -40)"/>
          </g>
          <circle r="42" fill="#70401f" stroke="#4d2c19" stroke-width="3"/>
          <circle r="32" fill="#8b5428"/>
          <g fill="#c18a3e">
            <circle cx="-13" cy="-12" r="3"/><circle cx="8" cy="-17" r="3"/>
            <circle cx="19" cy="0" r="3"/><circle cx="-18" cy="10" r="3"/>
            <circle cx="0" cy="17" r="3"/><circle cx="7" cy="5" r="3"/>
            <circle cx="-4" cy="-3" r="3"/><circle cx="20" cy="16" r="2.5"/>
          </g>
          <circle r="13" fill="#432719"/>
        </g>

        <!-- Girasol central -->
        <g class="flower center" transform="translate(250 165)">
          <g class="petal" fill="#ffd04b" stroke="#d78b19" stroke-width="2">
            <ellipse rx="17" ry="56" transform="rotate(0) translate(0 -43)"/>
            <ellipse rx="17" ry="56" transform="rotate(30) translate(0 -43)"/>
            <ellipse rx="17" ry="56" transform="rotate(60) translate(0 -43)"/>
            <ellipse rx="17" ry="56" transform="rotate(90) translate(0 -43)"/>
            <ellipse rx="17" ry="56" transform="rotate(120) translate(0 -43)"/>
            <ellipse rx="17" ry="56" transform="rotate(150) translate(0 -43)"/>
            <ellipse rx="17" ry="56" transform="rotate(180) translate(0 -43)"/>
            <ellipse rx="17" ry="56" transform="rotate(210) translate(0 -43)"/>
            <ellipse rx="17" ry="56" transform="rotate(240) translate(0 -43)"/>
            <ellipse rx="17" ry="56" transform="rotate(270) translate(0 -43)"/>
            <ellipse rx="17" ry="56" transform="rotate(300) translate(0 -43)"/>
            <ellipse rx="17" ry="56" transform="rotate(330) translate(0 -43)"/>
          </g>
          <circle r="45" fill="#70401f" stroke="#4d2c19" stroke-width="3"/>

          <g fill="#c18a3e">

            <circle cx="0" cy="19" r="3"/><circle cx="7" cy="5" r="3"/>
            <circle cx="-4" cy="-3" r="3"/><circle cx="20" cy="16" r="2.5"/>
          </g>
          <circle r="14" fill="#432719"/>
        </g>

        <!-- Girasol derecho -->
        <g class="flower right" transform="translate(342 250)">
          <g class="petal" fill="#f5b52f" stroke="#d78b19" stroke-width="2">
            <ellipse rx="16" ry="51" transform="rotate(0) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(30) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(60) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(90) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(120) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(150) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(180) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(210) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(240) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(270) translate(0 -40)"/>
            <ellipse rx="16" ry="51" transform="rotate(300) translate(0 -40)"/>

          </g>
          <circle r="42" fill="#70401f" stroke="#4d2c19" stroke-width="3"/>

          <g fill="#c18a3e">
            <circle cx="-13" cy="-12" r="3"/><circle cx="8" cy="-17" r="3"/>
            <circle cx="19" cy="0" r="3"/><circle cx="-18" cy="10" r="3"/>
            <circle cx="0" cy="17" r="3"/><circle cx="7" cy="5" r="3"/>

          </g>
          <circle r="13" fill="#432719"/>
        </g>

        <!-- Papel frontal: solo cubre la parte inferior, no las flores -->
        <path d="M105 370 L150 430 L250 492 L350 430 L395 370
                 L350 505 L250 548 L150 505 Z"
              fill="#fffefa" stroke="#d8cec0" stroke-width="2.2"/>

        <!-- Pliegues -->
        <g fill="none" stroke="#e5ddd2" stroke-width="2">
          <path d="M105 370 L150 505 L250 548"/>
          <path d="M395 370 L350 505 L250 548"/>
          <path d="M150 430 L215 510"/>
          <path d="M350 430 L285 510"/>
        </g>

        <!-- Moño -->
        <g stroke="#ad7e43" stroke-width="2" stroke-linejoin="round">
          <path d="M250 505 L170 477 L103 507 L133 558 L225 530 Z" fill="#dfbd7d"/>
          <path d="M250 505 L330 477 L397 507 L367 558 L275 530 Z" fill="#dfbd7d"/>
          <path d="M239 520 L190 545 L170 596 L230 555 L250 528 Z" fill="#d8b16c"/>
          <path d="M261 520 L310 545 L330 596 L270 555 L250 528 Z" fill="#d8b16c"/>
          <ellipse cx="250" cy="516" rx="21" ry="17" fill="#c79c58"/>
          <ellipse cx="250" cy="516" rx="13" ry="10" fill="#edce91"/>
        </g>
      </g>
    </svg>

    <div class="message">Para Maxi</div>

    <div class="decoration">
      <span>♡</span>
      <span class="heart">♥</span>
      <span>♡</span>
    </div>

  </main>

  <section class="letter" id="letter" aria-hidden="true">
    <div class="letter-top">♡ PARA MAXI ♡</div>
    <p>
      Sé que nos estamos conociendo, pero hoy es un día especial
      y quería darte un detalle.
    </p>
    <p>
      Estoy lejos, pero quiero usar lo que he aprendido
      para hacerte sonreír.
    </p>
    <p>Ten un lindo día, chiquis. 🌻</p>
    <button class="close-letter" id="closeLetter" type="button">
      Volver a ver el ramo
    </button>
  </section>


  <script>
    const welcome = document.getElementById("welcome");
    const openButton = document.getElementById("openButton");
    const mainCard = document.getElementById("mainCard");
    const letter = document.getElementById("letter");
    const closeLetter = document.getElementById("closeLetter");

    function createHeart() {
      const heart = document.createElement("span");
      heart.className = "floating-heart";
      heart.textContent = Math.random() > 0.5 ? "♡" : "✦";
      heart.style.left = `${Math.random() * 100}vw`;
      heart.style.fontSize = `${12 + Math.random() * 12}px`;
      heart.style.animationDuration = `${4 + Math.random() * 2}s`;
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6500);
    }

    openButton.addEventListener("click", () => {
      welcome.style.display = "none";
      mainCard.classList.add("show");
      mainCard.setAttribute("aria-hidden", "false");

      for (let i = 0; i < 10; i++) {
        setTimeout(createHeart, i * 130);
      }

      setTimeout(() => {
        letter.classList.add("show");
        letter.setAttribute("aria-hidden", "false");
      }, 1250);
    });

    closeLetter.addEventListener("click", () => {
      letter.classList.remove("show");
      letter.setAttribute("aria-hidden", "true");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>

</body>
</html>
